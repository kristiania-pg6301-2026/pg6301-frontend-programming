on:
  push:
    branches:
      - main
      - lecture/*
      - reference/*
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci # this is almost the same as npm install
      - run: npm test
      - run: npx vitest --run
