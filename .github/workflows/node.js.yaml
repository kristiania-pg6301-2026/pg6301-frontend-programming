on:
  push:
    branches:
      - main
      - lectures/*
      - reference/*
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24.x
      - run: npm ci
      - run: npm test
      - run: npx vitest --run
