<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test document</title>
    <style>
      svg {
        border: solid 1px red;
        text {
          text-anchor: middle;
        }

        .old-client {
          rect {
            width: 100px;
            height: 50px;
            fill: pink;
            stroke: red;
            stroke-width: 5;
          }
        }
        .message {
          rect {
            width: 50px;
            height: 25px;
            fill: lime;
            stroke: green;
            stroke-width: 5;
          }
          visibility: hidden;
          animation-fill-mode: forwards;

          &.animate {
            animation: move 2s;
          }
        }
      }

      @keyframes move {
        10% {
          visibility: visible;
          translate: 0 0;
        }
        100% {
          translate: 150px 110px;
        }
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
      <g class="old-client">
        <rect x="100" y="120" />
        <text x="150" y="150">Hello</text>
      </g>
      <path
        marker-end="url(#head)"
        stroke-width="4"
        fill="none"
        stroke="black"
        d="M150,80 150,110"
      />
      <g class="message" id="first-message">
        <rect x="140" y="100"></rect>
        <text x="170" y="120">Hello</text>
      </g>
      <g class="old-client">
        <rect x="300" y="120" />
        <text x="350" y="150">Hello</text>
      </g>
      <path
        marker-end="url(#head)"
        stroke-width="4"
        fill="none"
        stroke="black"
        d="M350,80 350,110"
      />
      <g class="old-client">
        <rect x="500" y="120" />
        <text x="550" y="150">Hello 2</text>
      </g>

      <g style="translate: 119px 20px; scale: 2">
        <path
          d="M16 15.503A5.041 5.041 0 1 0 16 5.42a5.041 5.041 0 0 0 0 10.083zm0 2.215c-6.703 0-11 3.699-11 5.5v3.363h22v-3.363c0-2.178-4.068-5.5-11-5.5z"
        ></path>
      </g>

      <g style="translate: 319px 20px; scale: 2">
        <path
          d="M16 15.503A5.041 5.041 0 1 0 16 5.42a5.041 5.041 0 0 0 0 10.083zm0 2.215c-6.703 0-11 3.699-11 5.5v3.363h22v-3.363c0-2.178-4.068-5.5-11-5.5z"
        ></path>
      </g>

      <defs>
        <marker
          id="head"
          orient="auto"
          markerWidth="3"
          markerHeight="4"
          refX="0.1"
          refY="2"
        >
          <path d="M0,0 V4 L2,2 Z" fill="black" />
        </marker>
      </defs>
    </svg>
  </body>
  <script>
    setTimeout(() => {
      document.getElementById("first-message").classList.add("animate");
    }, 2000);
  </script>
</html>
