<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test document</title>
    <style>
      svg {
        border: solid 1px red;
        text {
          text-anchor: middle;
        }

        .old-client {
          rect {
            width: 100px;
            height: 50px;
            fill: pink;
            stroke: red;
            stroke-width: 5;
          }
        }
        .message {
          rect {
            width: 50px;
            height: 25px;
            fill: lime;
            stroke: green;
            stroke-width: 5;
          }
          visibility: hidden;

          &.animate {
            animation: move 2s;
            animation-fill-mode: forwards;
            visibility: visible;
          }
        }
      }

      @keyframes move {
        10% {
          visibility: visible;
          translate: 0 0;
        }
        100% {
          translate: 150px 110px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
  </body>
  <script src="src/main.tsx" type="module"></script>
</html>
